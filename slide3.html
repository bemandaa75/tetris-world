<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>TETRIS – Member Detail</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="slide3.css">
</head>

<body>

    <!-- MEMBER DETAIL (full layar) | background: bg/bg3 -->
    <main class="screen" id="detail" data-bg="bg3">
        <div class="wrap">
            <div class="board">
                <button class="x" id="xbtn" aria-label="Kembali">✕</button>

                <div class="pol">
                    <div class="tape"></div>
                    <div class="photo" id="ph"><span class="qm">?</span></div>
                    <div class="stk s1">🐱</div>
                    <div class="stk s2">🌸</div>
                </div>

                <div class="info">
                    <span class="badge" id="badge"></span>
                    <h1 id="nm"></h1>
                    <div class="rule"></div>
                    <div class="quote" id="q"></div>
                    <b id="lbl"></b>
                    <p id="msg"></p>
                </div>
            </div>

        </div>
    </main>

    <script src="data.js"></script>
    <script src="slide3.js"></script>
</body>

</html>
